name: Build LMT Russian voiceover

on:
  push:
    branches:
      - automation/lmt-ru-voiceover-20260730
    paths:
      - tools/lmt_ru_voiceover/**
      - .github/workflows/build-lmt-ru-voiceover.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip edge-tts==7.2.8

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Build Russian voiceover
        run: python tools/lmt_ru_voiceover/build_audio.py

      - name: Upload voiceover
        uses: actions/upload-artifact@v4
        with:
          name: lmt-ru-voiceover
          path: tools/lmt_ru_voiceover/lmt_ru_voiceover.m4a
          if-no-files-found: error
          retention-days: 1
