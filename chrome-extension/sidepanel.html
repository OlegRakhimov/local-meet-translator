<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Перевод выделения</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 20px;
        background: Canvas;
        color: CanvasText;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 20px;
      }

      section + section {
        margin-top: 18px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.7;
      }

      .text-block {
        min-height: 72px;
        padding: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .error {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>Переводчик</h1>

    <section>
      <h2>Исходный текст</h2>
      <div id="source-text" class="text-block">Выделите текст и нажмите Alt+Shift+T.</div>
    </section>

    <section>
      <h2>Перевод</h2>
      <div id="translated-text" class="text-block" aria-live="polite">Перевод появится здесь.</div>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
