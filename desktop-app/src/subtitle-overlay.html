<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" />
  <title>Local Meet Translator — Local subtitles</title>
  <link rel="stylesheet" href="subtitle-overlay.css" />
</head>
<body>
  <main id="overlay" class="overlay" aria-live="polite">
    <header class="titlebar">
      <div class="dragArea">
        <span id="statusDot" class="statusDot idle"></span>
        <strong id="titleText">Local subtitles</strong>
        <span id="statusText" class="statusText">Idle</span>
      </div>
      <div class="controls">
        <button id="pauseButton" type="button" title="Pause">Ⅱ</button>
        <button id="clearButton" type="button" title="Clear">⌫</button>
        <button id="clickThroughButton" type="button" title="Click-through">⇩</button>
        <button id="hideButton" type="button" title="Hide">—</button>
      </div>
    </header>
    <section id="lines" class="lines">
      <article class="placeholder">
        <div id="waitingText" class="translation">Waiting for speech…</div>
      </article>
    </section>
    <footer id="protectionFooter" class="footer"></footer>
  </main>
  <script src="subtitle-overlay-renderer.js"></script>
</body>
</html>
